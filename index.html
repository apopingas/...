<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .dots {
            font-size: 36px;
            letter-spacing: 14px;
            color: #ffffff;
            user-select: none;
        }

        .countdown-box {
            text-align: center;
        }

        .days-big {
            font-size: clamp(64px, 18vw, 120px);
            font-weight: bold;
            line-height: 1;
            color: #ffffff;
        }

        .days-label {
            margin-top: 10px;
            font-size: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888888;
        }

        .hms {
            margin-top: 26px;
            font-size: clamp(22px, 6vw, 34px);
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
            color: #cccccc;
        }

        .hms-labels {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #666666;
        }
    </style>
</head>
<body>

    <section class="top">
        <div class="dots">...</div>
    </section>

    <section class="bottom">
        <div class="countdown-box">
            <div class="days-big" id="days">80</div>
            <div class="days-label">días</div>
            <div class="hms" id="hms">00:00:00</div>
            <div class="hms-labels">horas · minutos · segundos</div>
        </div>
    </section>

    <script>
        const STORAGE_KEY = "countdown80TargetMs";
        const EIGHTY_DAYS_MS = 80 * 24 * 60 * 60 * 1000;

        function getTargetTime() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = Number(saved);
                if (!Number.isNaN(parsed) && parsed > 0) {
                    return parsed;
                }
            }
            const target = Date.now() + EIGHTY_DAYS_MS;
            localStorage.setItem(STORAGE_KEY, String(target));
            return target;
        }

        const targetTime = getTargetTime();

        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function updateCountdown() {
            const remainingMs = Math.max(0, targetTime - Date.now());
            const totalSeconds = Math.floor(remainingMs / 1000);

            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById("days").textContent = days;
            document.getElementById("hms").textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
